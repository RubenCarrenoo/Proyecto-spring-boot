spring.application.name=coworkhub
server.port=8080

# ---------------------------------------------------------------
# MySQL 8 - base de datos coworkhub (usuario/clave: coworkhub)
# Ver scripts/01-create-database.sql
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:coworkhub}
spring.datasource.password=${DB_PASSWORD:coworkhub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=create es obligatorio para que Hibernate ejecute import.sql
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.SingleLineSqlScriptExtractor
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
# Tiempo maximo de espera de un bloqueo pesimista (ms) - RN-01 concurrencia
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# ---------------------------------------------------------------
# Configuracion propia de la aplicacion
# ---------------------------------------------------------------
# ADVERTENCIA EDUCATIVA: la clave JWT y las credenciales de MySQL (coworkhub/coworkhub)
# que aparecen aqui como valor por defecto son SOLO para este proyecto academico.
# En un entorno real NUNCA deben versionarse en el repositorio: se inyectan con
# variables de entorno (JWT_SECRET, DB_USERNAME, DB_PASSWORD) o un gestor de secretos.
# Si alguien obtiene esta clave puede firmar tokens validos con cualquier rol.
app.zone-id=America/Bogota
app.jwt.secret=${JWT_SECRET:Y293b3JraHViLXNlY3JldC1rZXktcGFyYS1qd3QtaHMyNTYtY2FtcHVzbGFuZHMtMjAyNg==}
app.jwt.expiration-minutes=60
app.jwt.issuer=coworkhub-api

# ---------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# Jackson: fechas en formato ISO
spring.jackson.time-zone=America/Bogota
